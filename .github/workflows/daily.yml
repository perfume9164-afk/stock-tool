name: 毎日スクリーニング＋スコア保存

on:
  schedule:
    # 毎朝 JST 9:15（UTC 00:15）月〜金：スコア保存
    - cron: '15 0 * * 1-5'
    # 毎日 JST 16:15（UTC 07:15）月〜金：スクリーニング
    - cron: '15 7 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード (score / screen / both)'
        required: false
        default: 'both'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係インストール
        run: pip install -r requirements.txt

      - name: 夕方のスクリーニング（16:15実行）
        if: github.event.schedule == '15 7 * * 1-5' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'screen' || github.event.inputs.mode == 'both'))
        run: python screener.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: 結果をコミット・プッシュ
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "auto: daily screening $(date +'%Y-%m-%d %H:%M')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
